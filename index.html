<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e8">
  <meta name="description" content="小学习机：今日任务、DeepSeek 问答、GitHub 存档同步。">
  <title>小学习机 · StudyHub</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" id="topbar">
      <div class="brand">
        <img class="brand-mark" src="icon-192.png" width="40" height="40" alt="" aria-hidden="true">
        <div>
          <h1 class="brand-title">小学习机</h1>
          <p class="brand-sub" id="study-date">—</p>
        </div>
      </div>
      <button type="button" class="chip" id="btn-quick-sync" title="拉取今日任务">同步</button>
    </header>

    <main class="app-main" id="app-main">
      <section class="view" id="view-today" data-view="today"></section>
      <section class="view view-chat" id="view-chat" data-view="chat" hidden></section>
      <section class="view" id="view-archive" data-view="archive" hidden></section>
      <section class="view" id="view-settings" data-view="settings" hidden></section>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="主导航">
      <button class="tab-item is-active" type="button" data-nav="today" aria-label="今日">
        <span class="tab-ico" aria-hidden="true">日</span>
        <span>今日</span>
      </button>
      <button class="tab-item" type="button" data-nav="chat" aria-label="问答">
        <span class="tab-ico" aria-hidden="true">问</span>
        <span>问答</span>
      </button>
      <button class="tab-item" type="button" data-nav="archive" aria-label="存档">
        <span class="tab-ico" aria-hidden="true">档</span>
        <span>存档</span>
      </button>
      <button class="tab-item" type="button" data-nav="settings" aria-label="设置">
        <span class="tab-ico" aria-hidden="true">设</span>
        <span>设置</span>
      </button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript><div class="noscript">请启用 JavaScript 后使用小学习机。</div></noscript>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/studyhub-render.js"></script>
  <script src="app.js"></script>
</body>
</html>
